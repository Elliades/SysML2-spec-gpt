<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lecteur SysML / KerML</title>
  <link rel="stylesheet" href="/static/viewer.css?v=7" />
</head>
<body id="viewer-app" data-viewer-app="3">
  <header class="topbar" role="banner">
    <div class="brand">
      <h1>Lecteur spec</h1>
      <span id="route-badge" class="badge" hidden></span>
    </div>
    <form id="search-form" class="search-form" role="search">
      <input id="query" type="search" placeholder="Rechercher (FR / EN)…" autocomplete="off" />
      <button type="submit" class="btn primary">Rechercher</button>
    </form>
    <div class="selectors">
      <label>
        <span>Version</span>
        <select id="version"></select>
      </label>
      <label>
        <span>Document</span>
        <select id="doc"></select>
      </label>
      <button id="pdf-btn" type="button" class="btn ghost" title="Page PDF originale">PDF</button>
    </div>
  </header>

  <div id="status" class="status" role="status" aria-live="polite" hidden></div>

  <div class="workspace">
    <aside id="toc-panel" class="panel toc-panel" aria-label="Sommaire">
      <div class="panel-head">
        <h2>Sommaire</h2>
        <input id="toc-filter" type="search" placeholder="Filtrer…" autocomplete="off" />
      </div>
      <nav id="toc-tree" class="toc-tree"></nav>
    </aside>
    <div id="toc-resizer" class="panel-resizer" role="separator" aria-orientation="vertical" aria-label="Redimensionner le sommaire" tabindex="0">
      <button id="toc-collapse" type="button" class="toc-edge-btn" title="Masquer le sommaire" aria-label="Masquer le sommaire" aria-expanded="true">‹</button>
    </div>
    <button id="toc-expand" type="button" class="toc-edge-btn toc-edge-expand" title="Afficher le sommaire" aria-label="Afficher le sommaire" hidden>›</button>

    <main id="reader" class="panel reader-panel" role="main">
      <div id="breadcrumb" class="breadcrumb"></div>
      <div id="reader-meta" class="reader-meta"></div>
      <div id="reader-loading" class="state loading" hidden>
        <div class="spinner"></div>
        <p>Chargement…</p>
      </div>
      <div id="reader-error" class="state error" hidden>
        <p id="reader-error-text"></p>
        <button id="reader-retry" type="button" class="btn">Réessayer</button>
      </div>
      <div id="reader-empty" class="state empty">
        <p>Sélectionnez un chapitre ou lancez une recherche.</p>
      </div>
      <article id="clause-body" class="clause-body" hidden></article>
      <div class="clause-nav">
        <button id="prev-clause" type="button" class="btn">‹ Clause</button>
        <button id="next-clause" type="button" class="btn">Clause ›</button>
      </div>
    </main>

    <aside id="cite-panel" class="panel cite-panel" aria-label="Citations">
      <div class="panel-head">
        <h2 id="cite-title">Citations</h2>
        <span id="cite-count" class="muted"></span>
      </div>
      <div id="search-results" class="search-results" hidden></div>
      <div id="cite-rail" class="cite-rail"></div>
    </aside>
  </div>

  <div id="pdf-overlay" class="pdf-overlay" hidden>
    <div class="pdf-toolbar">
      <button id="pdf-menu-btn" type="button" class="btn" aria-controls="pdf-toc-panel" aria-expanded="true">Sommaire</button>
      <button id="pdf-close" type="button" class="btn">Fermer</button>
      <button id="pdf-prev" type="button" class="btn" title="Page précédente">‹</button>
      <span id="pdf-page-label">—</span>
      <button id="pdf-next" type="button" class="btn" title="Page suivante">›</button>
    </div>
    <div class="pdf-body">
      <aside id="pdf-toc-panel" class="panel pdf-toc-panel" aria-label="Sommaire PDF">
        <div class="panel-head">
          <h2>Sommaire</h2>
          <button id="pdf-toc-close" type="button" class="btn ghost" title="Fermer le sommaire">✕</button>
        </div>
        <input id="pdf-toc-filter" type="search" placeholder="Filtrer…" autocomplete="off" />
        <nav id="pdf-toc-tree" class="toc-tree"></nav>
      </aside>
      <div id="pdf-canvas-wrap" class="pdf-canvas-wrap">
        <div class="pdf-page">
          <canvas id="pdf-canvas"></canvas>
          <div id="pdf-hl" class="pdf-hl"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="alert" hidden></div>

  <script type="module" src="/static/viewer.js?v=7"></script>
</body>
</html>
